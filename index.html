<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LIFT.">
  <meta name="theme-color" content="#f4f1ea">
  <title>LIFT.</title>

  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #f4f1ea;
      --paper-dark: #e8e4d8;
      --ink: #0d0d0d;
      --ink-soft: #2a2a2a;
      --ink-faint: #888278;
      --accent: #ff4500;
      --accent-ink: #f4f1ea;
      --warn: #c0392b;
    }

    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Archivo', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 25% 35%, rgba(13,13,13,0.025) 0%, transparent 0.5%),
        radial-gradient(circle at 75% 70%, rgba(13,13,13,0.025) 0%, transparent 0.5%),
        radial-gradient(circle at 50% 50%, rgba(13,13,13,0.02) 0%, transparent 0.5%);
      background-size: 3px 3px, 5px 5px, 7px 7px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    body {
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* TYPOGRAPHY */
    .display {
      font-family: 'Bebas Neue', 'Archivo Black', sans-serif;
      letter-spacing: 0.01em;
      line-height: 0.9;
      font-weight: 400;
    }
    .label {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
    }
    .num {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* MASTHEAD */
    .masthead {
      border-top: 4px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      padding: 18px 0 12px;
      margin-top: 14px;
      display: flex; align-items: flex-end; justify-content: space-between;
    }
    .masthead .wordmark { font-size: 64px; letter-spacing: -0.02em; }
    .masthead .meta { text-align: right; padding-bottom: 4px; }
    .masthead .meta .label { display: block; }
    .masthead .meta .date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 700; margin-top: 4px;
    }
    .strapline {
      padding: 8px 0 28px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--ink);
    }

    /* SECTION RULES */
    .section-rule {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 0 12px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 14px;
    }
    .section-rule .label { font-size: 12px; }
    .section-rule .num { font-size: 12px; }

    /* SCREENS */
    .screen { display: none; padding-bottom: 60px; }
    .screen.active { display: block; }

    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0 14px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 22px;
    }
    .back-btn {
      background: none; border: none; cursor: pointer;
      font-family: 'Archivo', sans-serif;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.14em; font-size: 11px;
      color: var(--ink); padding: 6px 0;
    }
    .top-bar .display { font-size: 32px; }

    /* SPLIT LIST */
    .split-row {
      display: flex; align-items: center;
      width: 100%;
      padding: 22px 0;
      border-bottom: 1px solid var(--ink);
      background: none; border-left: none; border-right: none; border-top: none;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      transition: padding 0.18s ease, background 0.18s ease;
    }
    .split-row:active {
      background: var(--ink); color: var(--paper);
      padding-left: 12px; padding-right: 12px;
    }
    .split-row .num { font-size: 13px; width: 48px; letter-spacing: 0.05em; }
    .split-row .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 44px; letter-spacing: 0; flex: 1;
    }
    .split-row .arrow { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }

    .nav-row {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 18px 0;
      border-bottom: 1px solid var(--ink);
      background: none; border-left: none; border-right: none; border-top: none;
      cursor: pointer;
      color: var(--ink);
      font-family: 'Archivo', sans-serif;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.14em; font-size: 13px;
    }
    .nav-row:active { background: var(--ink); color: var(--paper); padding-left: 12px; padding-right: 12px; }
    .nav-row .arrow { font-family: 'JetBrains Mono', monospace; }

    /* LOG SCREEN */
    .exercise-block {
      border-top: 2px solid var(--ink);
      padding: 18px 0 22px;
    }
    .exercise-block:last-of-type { border-bottom: 2px solid var(--ink); }
    .exercise-block.skipped { opacity: 0.35; }

    .exercise-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 6px;
    }
    .exercise-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px; letter-spacing: 0.005em; line-height: 1;
    }
    .skip-btn {
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 5px 9px;
      font-family: 'Archivo', sans-serif;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; font-size: 10px;
      cursor: pointer; color: var(--ink); margin-top: 4px;
    }
    .skip-btn.skipped { background: var(--ink); color: var(--paper); }
    .skip-btn:active { transform: translate(1px, 1px); }

    .exercise-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.05em;
      color: var(--ink-faint);
      margin-bottom: 14px; text-transform: uppercase;
    }

    .last-ref {
      display: flex; align-items: baseline; gap: 10px;
      padding: 10px 12px;
      background: var(--ink); color: var(--paper);
      margin-bottom: 16px;
    }
    .last-ref .label { font-size: 9px; color: var(--accent); }
    .last-ref .data {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700; font-size: 13px; letter-spacing: 0.04em;
    }

    .set-pick-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--ink);
    }
    .set-pick-row .label { margin-right: auto; }
    .set-pick-btn {
      width: 38px; height: 38px;
      border: 2px solid var(--ink);
      background: var(--paper);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700; font-size: 15px;
      cursor: pointer; color: var(--ink);
    }
    .set-pick-btn.active { background: var(--ink); color: var(--paper); }
    .set-pick-btn:active { transform: translate(1px, 1px); }

    .set-grid {
      display: grid;
      grid-template-columns: 36px 1fr 1fr;
      gap: 0;
    }
    .set-grid .head {
      border-bottom: 2px solid var(--ink);
      font-family: 'Archivo', sans-serif;
      font-weight: 700; font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-faint);
      padding: 6px 8px;
    }
    .set-grid .set-num {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700; font-size: 14px;
      align-self: center;
      padding: 12px 8px;
      border-bottom: 1px solid var(--ink);
    }
    .set-grid input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--ink);
      border-left: 1px solid var(--ink);
      border-radius: 0;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700; font-size: 18px;
      color: var(--ink);
      width: 100%;
      padding: 12px 12px;
      -moz-appearance: textfield;
    }
    .set-grid input::-webkit-outer-spin-button,
    .set-grid input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .set-grid input::placeholder { color: var(--ink-faint); font-weight: 400; }
    .set-grid input:focus {
      outline: none;
      background: var(--paper-dark);
    }

    .notes-input {
      width: 100%;
      margin-top: 14px;
      padding: 10px 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--ink);
      font-family: 'Archivo', sans-serif;
      font-size: 13px;
      color: var(--ink);
    }
    .notes-input:focus { outline: none; border-bottom-width: 2px; }
    .notes-input::placeholder { color: var(--ink-faint); font-style: italic; }

    /* SAVE BUTTON */
    .save-zone {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 4px solid var(--ink);
    }
    .save-btn {
      display: block; width: 100%;
      padding: 22px;
      background: var(--accent);
      color: var(--accent-ink);
      border: 4px solid var(--ink);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px; letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .save-btn:active {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--ink);
    }
    .save-btn:disabled { background: var(--ink-faint); cursor: not-allowed; }

    /* TABS */
    .tab-row {
      display: flex; gap: 0;
      margin-bottom: 24px;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-row::-webkit-scrollbar { display: none; }
    .tab {
      flex: 1;
      padding: 14px 12px;
      background: var(--paper);
      border: none;
      border-right: 1px solid var(--ink);
      font-family: 'Archivo', sans-serif;
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; font-size: 11px;
      color: var(--ink); cursor: pointer; white-space: nowrap;
    }
    .tab:last-child { border-right: none; }
    .tab.active { background: var(--ink); color: var(--paper); }

    /* LAST WEEK */
    .session-date {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px; margin-bottom: 4px;
    }
    .session-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--ink-faint);
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 24px; padding-bottom: 12px;
      border-bottom: 2px solid var(--ink);
    }
    .lw-exercise { margin-bottom: 28px; }
    .lw-exercise h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--ink);
    }
    .lw-set {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0;
      border-bottom: 1px dashed var(--ink-faint);
    }
    .lw-set:last-of-type { border-bottom: none; }
    .lw-set .set-label {
      font-family: 'Archivo', sans-serif;
      font-weight: 700; font-size: 11px;
      letter-spacing: 0.14em; color: var(--ink-faint);
      text-transform: uppercase;
    }
    .lw-set .set-data {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700; font-size: 16px; letter-spacing: 0.02em;
    }
    .lw-notes {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--paper-dark);
      border-left: 3px solid var(--ink);
      font-size: 13px; font-style: italic;
    }

    /* PROGRESS */
    .stat-block {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      margin-bottom: 24px;
      border-top: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
    }
    .stat {
      padding: 16px 12px;
      border-right: 1px solid var(--ink);
      text-align: left;
    }
    .stat:last-child { border-right: none; }
    .stat .label { display: block; margin-bottom: 6px; color: var(--ink-faint); }
    .stat .num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px; font-weight: 400;
      letter-spacing: 0; line-height: 1;
    }
    .stat .unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; margin-left: 2px;
      color: var(--ink-faint);
    }
    .chart-wrap {
      border: 2px solid var(--ink);
      padding: 16px;
      background: var(--paper);
      margin-bottom: 16px;
    }
    canvas { width: 100% !important; height: auto !important; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      border: 2px dashed var(--ink);
    }
    .empty-state .label { font-size: 12px; }
    .empty-state .display { font-size: 28px; margin-top: 8px; }

    .loading {
      padding: 40px 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--ink-faint);
    }

    .status {
      padding: 12px 14px; margin: 16px 0;
      font-family: 'Archivo', sans-serif;
      font-weight: 700; font-size: 12px;
      letter-spacing: 0.1em; text-transform: uppercase;
      border: 2px solid var(--ink);
    }
    .status.error { background: var(--warn); color: var(--paper); border-color: var(--warn); }
    .status.success { background: var(--ink); color: var(--accent); }
  </style>
</head>
<body>

  <!-- HOME -->
  <section id="screen-home" class="screen active">
    <div class="masthead">
      <div class="display wordmark">LIFT.</div>
      <div class="meta">
        <span class="label">Issue</span>
        <span class="date" id="today-date"></span>
      </div>
    </div>
    <div class="strapline">Personal training journal · Vol. 1</div>

    <div class="section-rule">
      <span class="label">Today's Programme</span>
      <span class="num">04 SPLITS</span>
    </div>

    <div>
      <button class="split-row" data-split="Push">
        <span class="num">01</span><span class="name">PUSH</span><span class="arrow">→</span>
      </button>
      <button class="split-row" data-split="Pull">
        <span class="num">02</span><span class="name">PULL</span><span class="arrow">→</span>
      </button>
      <button class="split-row" data-split="Legs">
        <span class="num">03</span><span class="name">LEGS</span><span class="arrow">→</span>
      </button>
      <button class="split-row" data-split="Mobility">
        <span class="num">04</span><span class="name">MOBILITY</span><span class="arrow">→</span>
      </button>
    </div>

    <div class="section-rule">
      <span class="label">Archive</span>
      <span class="num">02</span>
    </div>

    <div>
      <button class="nav-row" id="nav-lastweek"><span>Previous Sessions</span><span class="arrow">→</span></button>
      <button class="nav-row" id="nav-progress"><span>Progress</span><span class="arrow">→</span></button>
    </div>
  </section>

  <!-- LOG -->
  <section id="screen-log" class="screen">
    <div class="top-bar">
      <button class="back-btn" data-back="home">← Back</button>
      <div class="display" id="log-split-title">SPLIT</div>
      <span style="width: 42px;"></span>
    </div>
    <div id="log-content"><div class="loading">Loading…</div></div>
    <div id="log-actions" class="save-zone" style="display: none;">
      <button class="save-btn" id="save-workout">Log Session</button>
      <div id="save-status"></div>
    </div>
  </section>

  <!-- LAST WEEK -->
  <section id="screen-lastweek" class="screen">
    <div class="top-bar">
      <button class="back-btn" data-back="home">← Back</button>
      <div class="display">Previous</div>
      <span style="width: 42px;"></span>
    </div>
    <div class="tab-row" id="lastweek-tabs">
      <button class="tab active" data-split="Push">Push</button>
      <button class="tab" data-split="Pull">Pull</button>
      <button class="tab" data-split="Legs">Legs</button>
      <button class="tab" data-split="Mobility">Mobility</button>
    </div>
    <div id="lastweek-content"><div class="loading">Loading…</div></div>
  </section>

  <!-- PROGRESS -->
  <section id="screen-progress" class="screen">
    <div class="top-bar">
      <button class="back-btn" data-back="home">← Back</button>
      <div class="display">Progress</div>
      <span style="width: 42px;"></span>
    </div>
    <div class="tab-row" id="progress-tabs">
      <button class="tab active" data-exercise="Bench Press">Bench</button>
      <button class="tab" data-exercise="Squats">Squat</button>
      <button class="tab" data-exercise="Deadlift">Deadlift</button>
      <button class="tab" data-exercise="Overhead Press">OHP</button>
    </div>
    <div id="progress-stats-block"></div>
    <div class="chart-wrap">
      <canvas id="progress-chart"></canvas>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxj-t2vWLOFJodt1vXHy6VbotDeTOuYLN-uOpaZaSEj2VdzUVylIBbr9HmyFk0A5sEjjg/exec';

    let currentSplit = null;
    let currentTemplate = [];
    let currentLastWeek = { date: null, sets: [] };
    let exerciseState = {};
    let chartInstance = null;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + id).classList.add('active');
      window.scrollTo(0, 0);
    }
    document.querySelectorAll('[data-back]').forEach(btn =>
      btn.addEventListener('click', () => showScreen(btn.dataset.back)));
    document.querySelectorAll('.split-row').forEach(btn =>
      btn.addEventListener('click', () => openLogScreen(btn.dataset.split)));
    document.getElementById('nav-lastweek').addEventListener('click', () => {
      showScreen('lastweek'); loadLastWeek('Push');
    });
    document.getElementById('nav-progress').addEventListener('click', () => {
      showScreen('progress'); loadProgress('Bench Press');
    });

    async function apiGet(action, params = {}) {
      const qs = new URLSearchParams({ action, ...params }).toString();
      const res = await fetch(API_URL + '?' + qs);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Unknown error');
      return json.data;
    }
    async function apiPost(action, body) {
      const res = await fetch(API_URL + '?action=' + action, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Unknown error');
      return json.data;
    }

    function setTodayDate() {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const month = d.toLocaleString('en-US', { month: 'short' }).toUpperCase();
      const year = String(d.getFullYear()).slice(-2);
      document.getElementById('today-date').textContent = `${day}.${month}.${year}`;
    }
    setTodayDate();

    async function openLogScreen(split) {
      currentSplit = split;
      document.getElementById('log-split-title').textContent = split.toUpperCase();
      document.getElementById('log-content').innerHTML = '<div class="loading">Loading…</div>';
      document.getElementById('log-actions').style.display = 'none';
      showScreen('log');
      try {
        const [template, lastWeek] = await Promise.all([
          apiGet('getTemplate', { split }),
          apiGet('getLastWeek', { split })
        ]);
        currentTemplate = template;
        currentLastWeek = lastWeek;
        exerciseState = {};
        renderLogScreen();
        document.getElementById('log-actions').style.display = 'block';
      } catch (err) {
        document.getElementById('log-content').innerHTML =
          '<div class="status error">Failed to load: ' + err.message + '</div>';
      }
    }

    function renderLogScreen() {
      const container = document.getElementById('log-content');
      container.innerHTML = '';

      currentTemplate.forEach((ex, idx) => {
        const lastSets = currentLastWeek.sets.filter(s => s.exercise === ex.exercise);
        if (!exerciseState[ex.exercise]) {
          exerciseState[ex.exercise] = { setCount: 3, sets: [], skipped: false, notes: '' };
        }
        const state = exerciseState[ex.exercise];

        const equipMap = { bb: 'Barbell', db: 'Dumbbell', sm: 'Smith', bw: 'Bodyweight', mc: 'Machine', pl: 'Plate' };
        const equipLabel = equipMap[ex.equipment] || ex.equipment;

        let refLine = '';
        if (lastSets.length > 0) {
          const summary = lastSets.map(s => {
            if (ex.type === 'bodyweight') return s.weight ? `${s.reps}@+${s.weight}kg` : `${s.reps}`;
            if (ex.type === 'time') return `${s.weight}s`;
            return `${s.reps}@${s.weight}kg`;
          }).join(' / ');
          refLine = `<div class="last-ref"><span class="label">Last</span><span class="data">${summary}</span></div>`;
        }

        let setBtns = '';
        for (let i = 1; i <= 5; i++) {
          const active = i === state.setCount ? 'active' : '';
          setBtns += `<button class="set-pick-btn ${active}" data-ex="${escapeHtml(ex.exercise)}" data-count="${i}">${i}</button>`;
        }

        const weightHeader = ex.type === 'bodyweight' ? '+ kg' : ex.type === 'time' ? 'Sec' : 'Kg';
        let gridRows = `
          <div class="head">Set</div>
          <div class="head">Reps</div>
          <div class="head">${weightHeader}</div>
        `;
        for (let i = 1; i <= state.setCount; i++) {
          const existing = state.sets[i - 1] || {};
          const reps = existing.reps != null ? existing.reps : '';
          const weight = existing.weight != null ? existing.weight : '';
          gridRows += `
            <div class="set-num">${String(i).padStart(2, '0')}</div>
            <input type="number" inputmode="numeric" placeholder="—"
                   data-ex="${escapeHtml(ex.exercise)}" data-set="${i}" data-field="reps" value="${reps}">
            <input type="number" inputmode="decimal" placeholder="—"
                   data-ex="${escapeHtml(ex.exercise)}" data-set="${i}" data-field="weight" value="${weight}">
          `;
        }

        const block = document.createElement('div');
        block.className = `exercise-block ${state.skipped ? 'skipped' : ''}`;
        block.innerHTML = `
          <div class="exercise-head">
            <div class="exercise-name">${String(idx + 1).padStart(2, '0')} · ${escapeHtml(ex.exercise.toUpperCase())}</div>
            <button class="skip-btn ${state.skipped ? 'skipped' : ''}" data-skip="${escapeHtml(ex.exercise)}">${state.skipped ? 'Skipped' : 'Skip'}</button>
          </div>
          <div class="exercise-meta">${equipLabel} / ${ex.type}</div>
          ${state.skipped ? '' : `
            ${refLine}
            <div class="set-pick-row">
              <span class="label">Sets</span>
              ${setBtns}
            </div>
            <div class="set-grid">${gridRows}</div>
            <input type="text" class="notes-input" placeholder="Add a note…" data-notes="${escapeHtml(ex.exercise)}" value="${escapeHtml(state.notes || '')}">
          `}
        `;
        container.appendChild(block);
      });

      container.querySelectorAll('[data-skip]').forEach(b => {
        b.addEventListener('click', () => {
          const ex = b.dataset.skip;
          captureCurrentInputs();
          exerciseState[ex].skipped = !exerciseState[ex].skipped;
          renderLogScreen();
        });
      });
      container.querySelectorAll('.set-pick-btn').forEach(b => {
        b.addEventListener('click', () => {
          captureCurrentInputs();
          exerciseState[b.dataset.ex].setCount = parseInt(b.dataset.count, 10);
          renderLogScreen();
        });
      });
      container.querySelectorAll('[data-notes]').forEach(inp => {
        inp.addEventListener('input', () => {
          exerciseState[inp.dataset.notes].notes = inp.value;
        });
      });
    }

    function captureCurrentInputs() {
      document.querySelectorAll('input[data-set]').forEach(inp => {
        const ex = inp.dataset.ex;
        const setIdx = parseInt(inp.dataset.set, 10) - 1;
        const field = inp.dataset.field;
        if (!exerciseState[ex]) return;
        if (!exerciseState[ex].sets[setIdx]) exerciseState[ex].sets[setIdx] = {};
        exerciseState[ex].sets[setIdx][field] = inp.value === '' ? null : Number(inp.value);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    document.getElementById('save-workout').addEventListener('click', async () => {
      captureCurrentInputs();
      const today = new Date();
      const dateStr = today.getFullYear() + '-' +
        String(today.getMonth() + 1).padStart(2, '0') + '-' +
        String(today.getDate()).padStart(2, '0');

      const setsToLog = [];
      currentTemplate.forEach(ex => {
        const state = exerciseState[ex.exercise];
        if (state.skipped) return;
        for (let i = 1; i <= state.setCount; i++) {
          const s = state.sets[i - 1] || {};
          if (s.reps == null || s.reps === '') continue;
          let weight, unit;
          if (ex.type === 'bodyweight') {
            weight = (s.weight == null || s.weight === '') ? null : s.weight;
            unit = 'bw';
          } else if (ex.type === 'time') {
            weight = s.weight; unit = 'seconds';
          } else {
            weight = s.weight; unit = 'kg';
          }
          setsToLog.push({
            exercise: ex.exercise, set: i, reps: s.reps, weight, unit,
            notes: state.notes || ''
          });
        }
      });

      const status = document.getElementById('save-status');
      if (setsToLog.length === 0) {
        status.innerHTML = '<div class="status error">No sets to log</div>';
        return;
      }

      const btn = document.getElementById('save-workout');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      status.innerHTML = '';

      try {
        await apiPost('logWorkout', { date: dateStr, split: currentSplit, sets: setsToLog });
        status.innerHTML = `<div class="status success">Logged ${setsToLog.length} sets ✓</div>`;
        btn.textContent = 'Logged ✓';
        setTimeout(() => {
          showScreen('home');
          btn.disabled = false;
          btn.textContent = 'Log Session';
        }, 1200);
      } catch (err) {
        status.innerHTML = `<div class="status error">Failed: ${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Log Session';
      }
    });

    document.querySelectorAll('#lastweek-tabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#lastweek-tabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        loadLastWeek(tab.dataset.split);
      });
    });

    async function loadLastWeek(split) {
      const c = document.getElementById('lastweek-content');
      c.innerHTML = '<div class="loading">Loading…</div>';
      try {
        const data = await apiGet('getLastWeek', { split });
        if (!data.date || data.sets.length === 0) {
          c.innerHTML = `<div class="empty-state"><div class="label">No Record</div><div class="display">Nothing logged yet</div></div>`;
          return;
        }
        const grouped = {};
        data.sets.forEach(s => {
          if (!grouped[s.exercise]) grouped[s.exercise] = [];
          grouped[s.exercise].push(s);
        });

        const dateObj = new Date(data.date);
        const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
        const formatted = `${String(dateObj.getDate()).padStart(2, '0')}.${dateObj.toLocaleString('en-US', { month: 'short' }).toUpperCase()}.${String(dateObj.getFullYear()).slice(-2)}`;

        let html = `
          <div class="session-date">${dayName}</div>
          <div class="session-meta">${formatted} · ${split.toUpperCase()}</div>
        `;
        Object.entries(grouped).forEach(([ex, sets]) => {
          html += `<div class="lw-exercise"><h3>${escapeHtml(ex)}</h3>`;
          sets.forEach(s => {
            let right;
            if (s.unit === 'bw') right = s.weight ? `${s.reps} × +${s.weight}kg` : `${s.reps} × BW`;
            else if (s.unit === 'seconds') right = `${s.weight}s`;
            else right = `${s.reps} × ${s.weight}kg`;
            html += `<div class="lw-set"><span class="set-label">Set ${String(s.set).padStart(2, '0')}</span><span class="set-data">${right}</span></div>`;
          });
          if (sets[0].notes) html += `<div class="lw-notes">"${escapeHtml(sets[0].notes)}"</div>`;
          html += `</div>`;
        });
        c.innerHTML = html;
      } catch (err) {
        c.innerHTML = `<div class="status error">Failed: ${err.message}</div>`;
      }
    }

    document.querySelectorAll('#progress-tabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#progress-tabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        loadProgress(tab.dataset.exercise);
      });
    });

    async function loadProgress(exercise) {
      const stats = document.getElementById('progress-stats-block');
      stats.innerHTML = '<div class="loading">Loading…</div>';
      try {
        const data = await apiGet('getProgressData', { exercise });
        if (!data || data.length === 0) {
          stats.innerHTML = `<div class="empty-state"><div class="label">No Record</div><div class="display">Log ${exercise} to begin</div></div>`;
          if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
          return;
        }
        const byDate = {};
        data.forEach(d => {
          if (!byDate[d.date] || d.weight > byDate[d.date]) byDate[d.date] = d.weight;
        });
        const dates = Object.keys(byDate).sort();
        const weights = dates.map(d => byDate[d]);
        const max = Math.max(...weights);
        const latest = weights[weights.length - 1];

        stats.innerHTML = `
          <div class="stat-block">
            <div class="stat"><span class="label">Latest</span><span class="num">${latest}<span class="unit">kg</span></span></div>
            <div class="stat"><span class="label">PR</span><span class="num">${max}<span class="unit">kg</span></span></div>
            <div class="stat"><span class="label">Sessions</span><span class="num">${dates.length}</span></div>
          </div>
        `;
        renderChart(dates, weights, exercise);
      } catch (err) {
        stats.innerHTML = `<div class="status error">Failed: ${err.message}</div>`;
      }
    }

    function renderChart(dates, weights, label) {
      const ctx = document.getElementById('progress-chart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates,
          datasets: [{
            label: label,
            data: weights,
            borderColor: '#0d0d0d',
            backgroundColor: 'transparent',
            borderWidth: 3,
            tension: 0,
            pointRadius: 5,
            pointBackgroundColor: '#ff4500',
            pointBorderColor: '#0d0d0d',
            pointBorderWidth: 2,
            fill: false
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: { color: '#0d0d0d', font: { family: 'Archivo', weight: '700', size: 11 } }
            }
          },
          scales: {
            x: {
              ticks: { color: '#888278', font: { family: 'JetBrains Mono', size: 10 } },
              grid: { color: 'rgba(13,13,13,0.1)', borderDash: [2, 4] }
            },
            y: {
              ticks: { color: '#888278', font: { family: 'JetBrains Mono', size: 10 } },
              grid: { color: 'rgba(13,13,13,0.1)', borderDash: [2, 4] },
              beginAtZero: false
            }
          }
        }
      });
    }
  </script>
</body>
</html>
